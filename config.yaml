seed: 42

data:
  n_samples: 20000
  test_size: 0.2
  raw_path: data/raw/churn.csv

training:
  cv_folds: 5
  selection_metric: roc_auc
  calibration: sigmoid          # sigmoid (Platt) | isotonic
  models:
    logistic_regression:
      C: 1.0
      max_iter: 1000
    random_forest:
      n_estimators: 300
      min_samples_leaf: 5
      n_jobs: -1
    hist_gradient_boosting:
      learning_rate: 0.06
      max_iter: 300
      max_leaf_nodes: 15
      l2_regularization: 1.0

business:
  # Expected cost (in currency units) of each error type.
  cost_false_negative: 200     # churner we failed to flag (lost customer value)
  cost_false_positive: 20      # retention offer sent to a loyal customer

artifacts_dir: artifacts
